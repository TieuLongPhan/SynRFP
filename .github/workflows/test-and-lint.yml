name: Test, lint, and package

on:
  push:
    branches: ["main", "dev", "dev-lo"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test-lint:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,parallel]"
      - name: Lint
        run: bash scripts/lint.sh
      - name: Test
        run: bash scripts/pytest.sh --cov=synrfp --cov-report=term-missing

  package-smoke:
    name: Build and inspect distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build --sdist --wheel
      - name: Validate metadata and installed wheel
        run: |
          python -m twine check dist/*
          python scripts/check_package_artifacts.py dist
