# Separate environment for RXNFP (pins old transformers/torch).
#   conda env create -f environment.yml && conda activate rxnfp
name: rxnfp
channels: [conda-forge, pytorch]
dependencies:
  - python=3.8
  - rdkit
  - pytorch
  - pip
  - pip:
      - rxnfp
      - pandas
      - numpy<1.24,>=1.19  # >=1.24 removes np.typeDict, which the pinned old
                            # scipy/scikit-learn/transformers stack needs
      - pyyaml
      - scikit-learn
