# Minimal development environment for the synrfp package.
#   conda env create -f env.yml && conda activate synrfp
#   pip install -e ".[dev]"
# The benchmark suite has its own environment: Experiments/environment.yml
name: synrfp
channels:
  - conda-forge
dependencies:
  - python=3.11
  - rdkit>=2025.3.1
  - pip
